; Example PlatformIO project: an ESP-12E (ESP8266) Arduino sketch that uses HTMB.
; In your own project, pin a release tag in lib_deps like below.
; CI swaps lib_deps for the checkout it's testing (.github/workflows/platformio.yml).

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/oklar/htmb.git#c-v2.1.1
