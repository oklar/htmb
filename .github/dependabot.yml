# Opens one pull request a month per ecosystem when something has a newer version.
# CI runs on each pull request, so a bump that breaks a build or a test shows up there.
version: 2
updates:
  # actions/checkout, setup-node, setup-dotnet, setup-python and NuGet/login in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # typescript, used only to check the types in js/package
  - package-ecosystem: npm
    directory: /js/package
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]

  # xunit and the test SDK in cs/HtmbTests (the library itself has no dependencies)
  - package-ecosystem: nuget
    directory: /cs/HtmbSolution
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ["*"]
